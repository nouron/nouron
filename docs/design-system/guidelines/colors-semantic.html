<!-- @dsCard group="Colors" viewport="700x140" name="Semantic states" subtitle="Success, danger, warning — separate from brand accent" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:100%;font-family:system-ui">
<div style="flex:1;background:var(--color-success);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#fff">success #27ae60</div>
<div style="flex:1;background:var(--color-danger);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#fff">danger #c0392b</div>
<div style="flex:1;background:var(--color-warning-bg);border:1px solid var(--color-warning);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:var(--color-warning-fg)">warning</div>
<div style="flex:1;background:var(--color-locked);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:var(--color-locked-fg)">locked/disabled</div>
</div>
