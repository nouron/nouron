<!-- @dsCard group="Spacing" viewport="700x130" name="Spacing scale" subtitle="8px base — xs/sm/md/lg/xl/2xl" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;align-items:flex-end;gap:10px;height:100%;padding:16px;font-family:system-ui;font-size:10px;color:#666;background:var(--color-bg);box-sizing:border-box">
<div><div style="width:var(--space-xs);height:var(--space-xs);background:var(--color-accent)"></div>xs 4</div>
<div><div style="width:var(--space-sm);height:var(--space-sm);background:var(--color-accent)"></div>sm 8</div>
<div><div style="width:var(--space-md);height:var(--space-md);background:var(--color-accent)"></div>md 16</div>
<div><div style="width:var(--space-lg);height:var(--space-lg);background:var(--color-accent)"></div>lg 32</div>
<div><div style="width:var(--space-xl);height:var(--space-xl);background:var(--color-accent)"></div>xl 64</div>
</div>
