<!-- @dsCard group="Colors" viewport="700x150" name="Resource palette" subtitle="One fixed accent per resource abbreviation" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:grid;grid-template-columns:repeat(4,1fr);height:100%;font-family:system-ui;font-size:11px">
<div style="background:var(--res-credits-bg);border:1px solid var(--res-credits);display:flex;align-items:center;justify-content:center">Cr — Credits</div>
<div style="background:var(--res-regolith-bg);border:1px solid var(--res-regolith);display:flex;align-items:center;justify-content:center">Rg — Regolith</div>
<div style="background:var(--res-compounds-bg);border:1px solid var(--res-compounds);display:flex;align-items:center;justify-content:center">Co — Compounds</div>
<div style="background:var(--res-organics-bg);border:1px solid var(--res-organics);display:flex;align-items:center;justify-content:center">Or — Organics</div>
<div style="background:var(--res-supply-bg);border:1px solid var(--res-supply);display:flex;align-items:center;justify-content:center">Sup — Supply</div>
<div style="background:var(--res-trust-bg);border:1px solid var(--res-trust);display:flex;align-items:center;justify-content:center">Tr — Trust</div>
<div style="background:var(--res-sol-bg);border:1px solid var(--res-sol);display:flex;align-items:center;justify-content:center">Sol — Day</div>
<div style="background:var(--res-nexus-debt-bg);border:1px solid var(--res-nexus-debt);display:flex;align-items:center;justify-content:center">NX — Nexus debt</div>
</div>
