<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:100%;font-family:system-ui">
<div style="flex:1;background:var(--color-bg);border-right:1px solid var(--color-border);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#333">bg #fff</div>
<div style="flex:1;background:var(--color-surface);border-right:1px solid var(--color-border);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#333">surface #f7f7f5</div>
<div style="flex:1;background:var(--color-text-primary);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#fff">text-primary #1a1a1e</div>
<div style="flex:1;background:var(--color-text-secondary);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#fff">text-secondary #6b6b7a</div>
<div style="flex:1;background:var(--color-border);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#333">border #e8e8ec</div>
