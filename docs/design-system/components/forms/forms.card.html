<!-- @dsCard group="Components" viewport="700x360" name="Form elements" subtitle="Input, Select, Checkbox, Switch, Range — with FormField wrapper" -->
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="padding:1.25rem;background:#fff;display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;box-sizing:border-box"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Switch, RangeSlider, FormField } = window.NouronDesignSystem_019dc5;
function Demo(){
const [name,setName]=React.useState("Springfield");
const [target,setTarget]=React.useState("a");
const [remember,setRemember]=React.useState(true);
const [nexus,setNexus]=React.useState(false);
const [ap,setAp]=React.useState(8);
return (<>
<FormField label="Kolonie-Name" htmlFor="cname"><Input id="cname" value={name} onChange={e=>setName(e.target.value)} /></FormField>
<FormField label="Sektor" htmlFor="target"><Select id="target" value={target} onChange={e=>setTarget(e.target.value)} options={[{value:"a",label:"Sektor A"},{value:"b",label:"Sektor B"}]} /></FormField>
<FormField label="Passwort" htmlFor="pw" error="Mindestens 8 Zeichen"><Input id="pw" type="password" value="" onChange={()=>{}} /></FormField>
<FormField hint="Für zukünftige Anmeldungen"><Checkbox checked={remember} onChange={e=>setRemember(e.target.checked)} label="Angemeldet bleiben" /></FormField>
<FormField><Switch checked={nexus} onChange={e=>setNexus(e.target.checked)} label="Nexus-Kredit verwenden" /></FormField>
<FormField label={`Consul AP: ${ap}`}><RangeSlider value={ap} min={0} max={20} onChange={e=>setAp(+e.target.value)} /></FormField>
</>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
